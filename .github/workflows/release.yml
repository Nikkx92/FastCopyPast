name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install gogio
        run: go install gioui.org/cmd/gogio@latest

      - name: Build with gogio
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          CLEAN_VER=$(echo "$TAG_NAME" | sed 's/^v//')
          WIN_VER="${CLEAN_VER}.0"
          
          gogio -target windows \
                -version "$WIN_VER" \
                -icon appicon.png \
                -ldflags "-s -w -X 'main.version=$TAG_NAME'" \
                -o FastCopyPast.exe .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: FastCopyPast.exe
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
